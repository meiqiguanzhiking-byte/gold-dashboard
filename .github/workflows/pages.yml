name: 发布黄金看板静态展示版

on:
  workflow_dispatch:
    inputs:
      confirm_public_data:
        description: 已确认快照数值、历史序列和页面品牌可以公开
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirm_public_data }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: 获取项目
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 读取当前仓库真实 Pages 路径
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: 准备 Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 安装前端依赖
        working-directory: 前端
        run: npm ci --logs-max=0 --no-audit --no-fund
      - name: 校验已审阅快照并构建展示版
        working-directory: 前端
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node checks/pages-artifact.mjs --snapshot-only
          npm run build:pages -- --base="${PAGES_BASE_PATH}/"
          node checks/pages-artifact.mjs
      - name: 仅上传静态网站产物
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: 展示版/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
